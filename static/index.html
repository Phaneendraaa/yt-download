<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Downloader</title>
<style>
  :root {
    --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e8eaf0; --muted:#8b93a7;
    --accent:#ff3d3d; --ok:#2fbf71; --err:#ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5f8; --card:#fff; --line:#e2e5ec; --text:#14171f; --muted:#667085; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  textarea { width:100%; min-height:110px; resize:vertical; background:transparent; color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit; }
  textarea:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  select { background:transparent; color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:9px 10px; font:inherit; }
  select option { color:#000; }
  label.chk { display:flex; gap:6px; align-items:center; color:var(--muted); cursor:pointer; }
  button { border:0; border-radius:10px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; margin-left:auto; }
  .primary:disabled { opacity:.5; cursor:default; }
  .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); padding:7px 12px; font-weight:500; }
  .head { display:flex; justify-content:space-between; align-items:center; margin:28px 0 10px; }
  .head h2 { font-size:16px; margin:0; }
  .head div { display:flex; gap:8px; }
  .job { margin-bottom:10px; }
  .top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .title { font-weight:600; word-break:break-word; }
  .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; border:1px solid var(--line);
    white-space:nowrap; color:var(--muted); }
  .badge.done { color:var(--ok); border-color:var(--ok); }
  .badge.error { color:var(--err); border-color:var(--err); }
  .badge.downloading, .badge.processing { color:var(--accent); border-color:var(--accent); }
  .bar { height:6px; background:var(--line); border-radius:99px; margin-top:10px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  .job.done .bar i { background:var(--ok); }
  .err { color:var(--err); font-size:13px; margin-top:8px; word-break:break-word; }
  .files { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  a { color:var(--accent); font-size:14px; word-break:break-all; }
  .empty { color:var(--muted); text-align:center; padding:28px 0; }
  .note { color:var(--muted); font-size:12px; margin-top:18px; }
</style>
</head>
<body>
<main>
  <h1>YouTube Downloader</h1>
  <p class="sub">Paste one link per line. Up to 3 download at the same time.</p>

  <div class="card">
    <textarea id="urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/..."></textarea>
    <div class="row">
      <select id="quality" aria-label="Quality">
        <option value="best">Best quality (MP4)</option>
        <option value="1080">1080p (MP4)</option>
        <option value="720">720p (MP4)</option>
        <option value="480">480p (MP4)</option>
        <option value="mp3">Audio only (MP3)</option>
      </select>
      <label class="chk"><input type="checkbox" id="playlist"> Download whole playlist</label>
      <button class="primary" id="go">Download</button>
    </div>
  </div>

  <div class="head">
    <h2>Downloads</h2>
    <div>
      <button class="ghost" id="folder">Open folder</button>
      <button class="ghost" id="clear">Clear finished</button>
    </div>
  </div>
  <div id="list"><div class="empty">Nothing yet. Paste a link above.</div></div>
  <p class="note">Files are saved in the <code>downloads</code> folder next to the app. Only download videos you own or have permission to use.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = { queued:'Queued', downloading:'Downloading', processing:'Processing', done:'Done', error:'Failed' };

$('go').onclick = async () => {
  const urls = $('urls').value.split(/\s+/).filter(Boolean);
  if (!urls.length) return $('urls').focus();
  $('go').disabled = true;
  try {
    await fetch('/api/add', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ urls, quality:$('quality').value, playlist:$('playlist').checked }) });
    $('urls').value = '';
    refresh();
  } finally { $('go').disabled = false; }
};
$('clear').onclick = async () => { await fetch('/api/clear', { method:'POST' }); refresh(); };
$('folder').onclick = async () => {
  const r = await (await fetch('/api/open-folder', { method:'POST' })).json();
  if (!navigator.userAgent.includes('Windows')) alert('Folder: ' + r.path);
};

function render(jobs) {
  if (!jobs.length) { $('list').innerHTML = '<div class="empty">Nothing yet. Paste a link above.</div>'; return; }
  $('list').innerHTML = jobs.slice().reverse().map(j => {
    const bits = [j.item && `Item ${j.item}`, j.speed, j.eta && `ETA ${j.eta}`].filter(Boolean).join(' · ');
    const files = j.files.map(f => `<a href="/files/${encodeURIComponent(f)}" download>Save: ${esc(f)}</a>`).join('');
    return `<div class="card job ${j.status}">
      <div class="top">
        <div><div class="title">${esc(j.title)}</div><div class="meta">${esc(bits || j.url)}</div></div>
        <span class="badge ${j.status}">${label[j.status]}${j.status==='downloading' ? ' ' + Math.round(j.percent) + '%' : ''}</span>
      </div>
      <div class="bar"><i style="width:${j.percent}%"></i></div>
      ${j.error ? `<div class="err">${esc(j.error)}</div>` : ''}
      ${files ? `<div class="files">${files}</div>` : ''}
    </div>`;
  }).join('');
}

async function refresh() {
  try { render(await (await fetch('/api/jobs')).json()); } catch (e) {}
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
